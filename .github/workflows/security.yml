name: Security checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/itsm-gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/itsm-gitleaks" gitleaks
          echo "$RUNNER_TEMP/itsm-gitleaks" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify secret detection with an ephemeral synthetic canary
        run: node scripts/verify-secret-scanner.mjs
      - name: Scan complete checked-out Git history with fully redacted findings
        run: gitleaks git . --gitleaks-ignore-path "$RUNNER_TEMP/itsm-gitleaks-ignore" --redact=100 --verbose --no-banner --no-color --exit-code 1

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install version-pinned local scanner
        run: python -m pip install semgrep==1.185.0
      - name: Verify positive and negative static-analysis fixtures
        run: semgrep scan --test --config infra/security/semgrep.yml tests/security/semgrep.ts --metrics off --disable-version-check
      - name: Reject dangerous code execution and disabled TLS verification
        run: semgrep scan --config infra/security/semgrep.yml --error --strict --metrics off --disable-version-check apps packages scripts

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Reject high and critical advisories including development tooling
        run: npm audit --audit-level=high
