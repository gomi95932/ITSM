name: Release source verification

on:
  workflow_run:
    workflows: [Application CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full approved main commit SHA
        required: true
        type: string
      run_id:
        description: Successful Application CI run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify-source:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == 'gomi95932/ITSM')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify completed main run and release artifact without executing it
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
          RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-source.mjs "$RELEASE_SHA" "$RELEASE_RUN_ID" > "$RUNNER_TEMP/release-source.json"
      - name: Download, verify and safely stage the exact artifact without deploying
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
          RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/itsm-staging"
          node scripts/stage-release.mjs "$RELEASE_SHA" "$RELEASE_RUN_ID" "$RUNNER_TEMP/itsm-staging/release" > "$RUNNER_TEMP/release-staging.json"
      - uses: actions/upload-artifact@v6
        with:
          name: release-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-source.json
            ${{ runner.temp }}/release-staging.json
          retention-days: 30
