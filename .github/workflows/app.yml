name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: docker compose --env-file infra/compose/.env.example -f infra/compose/compose.yaml config --quiet
      - name: Build and start isolated test stack
        run: docker compose --env-file infra/compose/.env.example -f infra/compose/compose.yaml up -d --build --wait --wait-timeout 180
      - name: Check web and API routes
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8088/ -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/api/v1/health | grep -q '"status":"ok"'
      - name: Show containers on failure
        if: failure()
        run: docker compose --env-file infra/compose/.env.example -f infra/compose/compose.yaml ps -a

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image name
        id: name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.name.outputs.repository }}-${{ matrix.app }}:${{ github.sha }}

  publish-data-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: postgres
            upstream: postgres:16-alpine
          - app: redis
            upstream: redis:7.4-alpine
    steps:
      - name: Normalize image name
        id: name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy tested upstream image to private GHCR
        env:
          SOURCE: ${{ matrix.upstream }}
          TARGET: ghcr.io/${{ steps.name.outputs.repository }}-${{ matrix.app }}:${{ github.sha }}
        run: |
          docker pull "$SOURCE"
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"
