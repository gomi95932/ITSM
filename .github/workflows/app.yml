name: Application CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security:
    uses: ./.github/workflows/security.yml

  authorization-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: itsm
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U itsm -d itsm"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: itsm
      DB_USER: itsm
      DB_PASSWORD: disposable-ci-only
      ITSM_SEED_DEV_DATA: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/migrate.mjs
      - run: npm run build -w @itsm/contracts && npm run build -w @itsm/worker
      - name: Measure current authorization plans in an isolated database
        run: node tests/integration/authorization-performance.mjs

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      postgres-image: ${{ steps.tested-data.outputs.postgres }}
      redis-image: ${{ steps.tested-data.outputs.redis }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Discover browser tests before starting the isolated stack
        run: npx playwright test --list
      - name: Reject unsafe release archives with isolated Python fixtures
        run: python3 tests/unit/release-extraction.py
      - name: Verify privileged promotion boundary in disposable root-owned CI fixtures
        run: sudo -n env -i PATH=/usr/bin:/bin "$(command -v node)" tests/integration/release-promotion.mjs
      - name: Verify approved deployment execution boundary in disposable root-owned CI fixtures
        run: sudo -n env -i PATH=/usr/bin:/bin "$(command -v node)" tests/integration/approved-deployment.mjs
      - name: Verify read-only development inspection and drift detection in disposable root-owned CI fixtures
        run: sudo -n env -i PATH=/usr/bin:/bin "$(command -v node)" tests/integration/development-inspection.mjs
      - name: Validate fixed approved deployment service template
        run: systemd-analyze verify infra/systemd/itsm-deploy-approved@.service
      - name: Set disposable CI configuration path
        run: echo "ITSM_CI_ENV=$RUNNER_TEMP/itsm-ci.env" >> "$GITHUB_ENV"
      - name: Create private disposable CI configuration
        run: node scripts/create-development-env.mjs "$ITSM_CI_ENV" --seed-development-fixtures
      - run: docker compose --env-file "$ITSM_CI_ENV" -f infra/compose/compose.yaml config --quiet
      - name: Build and start isolated test stack
        run: docker compose --env-file "$ITSM_CI_ENV" -f infra/compose/compose.yaml up -d --build --wait --wait-timeout 180
      - name: Record data images actually tested
        id: tested-data
        run: |
          echo "postgres=$(docker image inspect postgres:16-alpine --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"
          echo "redis=$(docker image inspect redis:7.4-alpine --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"
      - name: Verify proxy connection reuse and API address replacement
        run: node tests/integration/proxy-keepalive.mjs
      - name: Verify running container images and deployment isolation
        run: node tests/integration/runtime-images.mjs
      - name: Check web and API routes
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8088/ -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/api/v1/health | grep -q '"status":"ok"'
      - name: Exercise ticket API and database audit invariants
        run: |
          node tests/integration/tickets.mjs
          docker compose --env-file "$ITSM_CI_ENV" -f infra/compose/compose.yaml exec -T db sh -ec '
            export PGPASSWORD="$POSTGRES_PASSWORD"
            psql -U itsm -d itsm -tAc "SELECT count(*) FROM tickets" | grep -q "^2$"
            psql -U itsm -d itsm -tAc "SELECT count(*) FROM ticket_events" | grep -q "^5$"
            psql -U itsm -d itsm -tAc "SELECT count(*) FROM audit_logs" | grep -q "^5$"
            psql -U itsm -d itsm -tAc "SELECT count(*) FROM outbox_events" | grep -q "^5$"
          '
      - name: Exercise workspace permissions, SLA and voice draft invariants
        run: node tests/integration/workspace.mjs
      - name: Verify real bounded audio decoding without recording files
        run: node tests/integration/voice-audio.mjs
      - name: Verify controlled attachment HTTP, database and authorization boundaries with protocol fixtures
        run: node tests/integration/attachments.mjs
      - name: Verify immediate session revocation after employee or identity changes
        run: node tests/integration/identity-revocation.mjs
      - name: Verify independent OIDC identity, callback replay and session revocation with protocol fixtures
        run: node tests/integration/oidc-login.mjs
      - name: Verify directory synchronization, safe retirement and administrator permissions
        run: node tests/integration/directory-sync.mjs
      - name: Verify ordinary intake blocks sensitive payloads without persistence
        run: |
          node tests/integration/intake-policy.mjs
          docker compose --env-file "$ITSM_CI_ENV" -f infra/compose/compose.yaml exec -T db sh -ec '
            export PGPASSWORD="$POSTGRES_PASSWORD"
            for table in tickets ticket_events audit_logs outbox_events api_idempotency voice_drafts operational_audits notification_deliveries ticket_responsibility_history; do
              psql -U itsm -d itsm -tAc "SELECT count(*) FROM $table t WHERE strpos(row_to_json(t)::text, '\''blocked-intake-sentinel'\'') > 0" | grep -q "^0$"
            done
            psql -U itsm -d itsm -tAc "SELECT count(*) > 0 FROM operational_audits WHERE action='\''SECURITY_CHANNEL_REQUIRED'\''" | grep -q "^t$"
          '
      - name: Verify immutable migrations and isolated backup recovery
        run: node tests/integration/migrations.mjs
      - name: Verify personal ownership, handover and disabled-person recovery
        run: node tests/integration/ownership.mjs
      - name: Verify candidate dispatch, confirmation, expiry and concurrent claim
        run: node tests/integration/assignment-offers.mjs
      - name: Verify scoped roles, independent review and immediate dispatch revocation
        run: node tests/integration/roles.mjs
      - name: Verify reviewed routing configuration and immutable audit
        run: node tests/integration/routing-config.mjs
      - name: Verify targeted notification audiences, live revocation and scoped retries
        run: node tests/integration/notification-audience.mjs
      - name: Verify notification recovery without duplicate sends
        run: |
          compose=(docker compose --env-file "$ITSM_CI_ENV" -f infra/compose/compose.yaml)
          "${compose[@]}" stop worker
          trap '"${compose[@]}" up -d --no-deps --wait worker' EXIT
          "${compose[@]}" run --no-deps --rm -T -e ITSM_NOTIFICATION_CI=true --entrypoint node worker --input-type=module < tests/integration/notification-dispatch-runner.mjs
      - name: Verify resolution-based confirmation auto-close
        run: node tests/integration/auto-close.mjs
      - name: Verify requester-only immutable service feedback
        run: node tests/integration/ticket-feedback.mjs
      - name: Verify knowledge review, immutable publication, reader feedback and audience boundaries
        run: node tests/integration/knowledge.mjs
      - name: Verify immediate P1 alerts and scoped supervisor confirmation
        run: node tests/integration/priority-review.mjs
      - name: Verify configurable priority governance and preserved SLA obligations
        run: node tests/integration/priority-governance.mjs
      - name: Verify independently approved service calendars and immutable SLA snapshots
        run: node tests/integration/service-calendar.mjs
      - name: Verify GEN intake, classification and revocable proxy boundaries
        run: node tests/integration/intake-triage.mjs
      - name: Verify appointment withdrawal, supervised continuity and expiring per-ticket exceptions
        run: node tests/integration/ticket-continuity.mjs
      - name: Install CI browser
        run: npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile employee and agent flows
        run: |
          mkdir -p test-results
          # Keep only wait metadata, never SQL text, credentials or business payloads.
          (
            for sample in $(seq 1 180); do
              timeout 5s docker compose --env-file "$ITSM_CI_ENV" -f infra/compose/compose.yaml exec -T db sh -ec '
                export PGPASSWORD="$POSTGRES_PASSWORD"
                exec psql -X -v ON_ERROR_STOP=1 -U itsm -d itsm -At
              ' < tests/support/database-waits.sql || true
              sleep 2
            done
          ) > test-results/database-waits.jsonl 2>/dev/null &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          npx playwright test --output test-results/workspace
      - name: Verify REQ policy versions, publisher scope and fail-closed OA boundary
        run: node tests/integration/request-catalog.mjs
      - name: Verify durable OA and controlled manual fulfillment without enabling live service requests
        run: node tests/integration/request-approval.mjs
      - name: Verify requester-only REQ approval and fulfillment progress
        run: node tests/integration/request-progress.mjs
      - name: Verify scoped fulfillment review, revocation, current appointments and exactly-once commands
        run: node tests/integration/fulfillment.mjs
      - name: Verify approved request delivery, independent review, confirmation and guarded closure
        run: node tests/integration/request-lifecycle.mjs
      - name: Verify fulfillment reminders, late appointments, recovery rollback and concurrent deduplication
        run: node tests/integration/fulfillment-attention.mjs
      - name: Verify service report boundaries and lifecycle metrics
        run: node tests/integration/reports.mjs
      - name: Verify structured waiting, follow-up deadlines, ownership continuity and scoped reports
        run: node tests/integration/ticket-waiting.mjs
      - name: Verify waiting reminders, live recipient qualification, atomic recovery and concurrent deduplication
        run: |
          compose=(docker compose --env-file "$ITSM_CI_ENV" -f infra/compose/compose.yaml)
          "${compose[@]}" stop worker
          trap 'result=$?; "${compose[@]}" up -d --no-deps --wait --wait-timeout 90 worker || result=1; exit "$result"' EXIT
          node tests/integration/waiting-follow-up.mjs
      - name: Verify historical responsibility capture, legacy baseline and scoped interval reports
        run: node tests/integration/responsibility-history.mjs
      - name: Verify scoped notification reports, private-field filtering and full-cohort limits
        env:
          ITSM_NOTIFICATION_REPORT_WORKER_STOPPED: 'true'
        run: |
          compose=(docker compose --env-file "$ITSM_CI_ENV" -f infra/compose/compose.yaml)
          "${compose[@]}" stop worker
          trap 'result=$?; "${compose[@]}" up -d --no-deps --wait --wait-timeout 90 worker || result=1; exit "$result"' EXIT
          node tests/integration/notification-report.mjs
      - name: Verify repeatable development acceptance on a populated database
        run: |
          node scripts/verify-development.mjs --base-url http://127.0.0.1:8088 --allow-synthetic-writes
          node scripts/verify-development.mjs --base-url http://127.0.0.1:8088 --allow-synthetic-writes
      - name: Verify configurable support structure and scoped membership removal
        run: node tests/integration/support-structure.mjs
      - name: Verify configurable service domains, appointments and historical routing
        run: node tests/integration/service-structure.mjs
      - name: Verify reviewed service catalog and position routing bundles
        run: node tests/integration/service-catalog.mjs
      - name: Verify support group lifecycle, dependency guards and historical preservation
        run: node tests/integration/support-group-lifecycle.mjs
      - name: Enable manual delivery HTTP boundary in disposable CI only
        id: enable-manual-delivery
        env:
          ENABLE_MANUAL_REQUEST_DELIVERY: 'true'
        run: |
          compose=(docker compose --env-file "$ITSM_CI_ENV" -f infra/compose/compose.yaml)
          "${compose[@]}" up -d --no-deps --wait --wait-timeout 90 api
          "${compose[@]}" up -d --no-deps --force-recreate --wait --wait-timeout 90 web
      - name: Verify queued delivery intent, worker reinspection, concurrency and atomic receipts
        run: node tests/integration/request-delivery.mjs
      - name: Verify failed delivery investigation, independent resolution and blocked retries
        run: node tests/integration/delivery-failures.mjs
      - name: Verify desktop and mobile first-delivery workspace against synthetic provider
        env:
          ITSM_DELIVERY_CI_ENABLED: 'true'
        run: npx playwright test tests/e2e/request-delivery.spec.ts --output test-results/request-delivery
      - name: Restore default closed manual-delivery boundary
        if: ${{ always() && steps.enable-manual-delivery.outcome != 'skipped' && steps.enable-manual-delivery.outcome != '' }}
        run: |
          compose=(docker compose --env-file "$ITSM_CI_ENV" -f infra/compose/compose.yaml)
          "${compose[@]}" up -d --no-deps --wait --wait-timeout 90 api
          "${compose[@]}" up -d --no-deps --force-recreate --wait --wait-timeout 90 web
      - name: Verify atomic request intake and employee progress with synthetic approval identities
        run: |
          compose=(docker compose --env-file "$ITSM_CI_ENV" -f infra/compose/compose.yaml)
          default_boundary() {
            "${compose[@]}" up -d --no-deps --wait --wait-timeout 90 api &&
            "${compose[@]}" up -d --no-deps --force-recreate --wait --wait-timeout 90 web &&
            "${compose[@]}" exec -T api sh -ec 'test "$ENABLE_REQUEST_INTAKE" = false && test "$ENABLE_LIVE_OA_APPROVAL" = false && test "$ENABLE_MANUAL_REQUEST_DELIVERY" = false'
          }
          trap 'result=$?; default_boundary || result=1; exit "$result"' EXIT
          "${compose[@]}" exec -T worker sh -ec 'test "$ENABLE_LIVE_OA_APPROVAL" = false && test "$ENABLE_LIVE_NOTIFICATIONS" = false'
          ENABLE_REQUEST_INTAKE=true ENABLE_LIVE_OA_APPROVAL=true ENABLE_MANUAL_REQUEST_DELIVERY=true \
            REQUEST_INTAKE_CATALOG_VERSIONS=REQ-INTAKE-CI@1,REQ-INTAKE-UI@1 REQUEST_APPROVAL_TIMEOUT_MINUTES=60 \
            DINGTALK_CORP_ID=ci-intake-corp DINGTALK_APP_KEY=ci-placeholder DINGTALK_APP_SECRET=ci-placeholder \
            "${compose[@]}" up -d --no-deps --wait --wait-timeout 90 api
          "${compose[@]}" up -d --no-deps --force-recreate --wait --wait-timeout 90 web
          node tests/integration/request-intake.mjs
          ITSM_REQUEST_INTAKE_CI_ENABLED=true npx playwright test tests/e2e/request-intake.spec.ts --output test-results/request-intake
      - name: Verify trusted sites, service SLA snapshots and emergency ownership in final disposable phase
        run: node tests/integration/operations-scope.mjs
      - name: Verify browser evidence survived all isolated test phases
        run: |
          for viewport in desktop mobile; do
            for scene in attachments directory voice notification-deeplink request-lifecycle-feedback reports-requests reports-personal reports-history reports-notifications waiting-detail waiting-reports request-delivery-completed request-intake-progress operations appointments; do
              test -s "test-results/${scene}-${viewport}.png"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-results
          path: test-results/
          retention-days: 14
      - name: Show containers on failure
        if: failure() && env.ITSM_CI_ENV != ''
        run: docker compose --env-file "$ITSM_CI_ENV" -f infra/compose/compose.yaml ps -a

  publish:
    name: publish-${{ matrix.app }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image name
        id: name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.name.outputs.repository }}-${{ matrix.app }}:${{ github.sha }}

  publish-data-images:
    name: publish-${{ matrix.app }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: postgres
            upstream: ${{ needs.build-test.outputs.postgres-image }}
          - app: redis
            upstream: ${{ needs.build-test.outputs.redis-image }}
    steps:
      - name: Normalize image name
        id: name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy tested upstream image to private GHCR
        env:
          SOURCE: ${{ matrix.upstream }}
          TARGET: ghcr.io/${{ steps.name.outputs.repository }}-${{ matrix.app }}:${{ github.sha }}
        run: |
          docker pull "$SOURCE"
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"

  release-bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, publish, publish-data-images]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package verified main commit and immutable image digests
        run: |
          node scripts/package-release.mjs "$GITHUB_SHA" "$RUNNER_TEMP/itsm-release"
          tar -czf "itsm-release-${GITHUB_SHA}.tar.gz" -C "$RUNNER_TEMP/itsm-release" .
          sha256sum "itsm-release-${GITHUB_SHA}.tar.gz" > "itsm-release-${GITHUB_SHA}.tar.gz.sha256"
      - name: Rehearse deployment and recovery from the exact release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="itsm-release-${GITHUB_SHA}.tar.gz"
          sha256sum --check "${archive}.sha256"
          release_root="$RUNNER_TEMP/itsm-release-rehearsal"
          private_env="$RUNNER_TEMP/itsm-release-rehearsal.env"
          state="$RUNNER_TEMP/itsm-release-rehearsal-state"
          mkdir "$release_root"
          tar -xzf "$archive" -C "$release_root"
          node "$release_root/scripts/create-development-env.mjs" "$private_env" --seed-development-fixtures
          release() {
            node "$release_root/scripts/release.mjs" "$@" --env "$private_env" --state "$state"
          }
          release check
          release deploy "$GITHUB_SHA" --verify-development
          node tests/integration/release-evidence.mjs "$state/current.json" "$GITHUB_SHA"
          node tests/integration/tickets.mjs
          node "$release_root/scripts/verify-development.mjs" --base-url http://127.0.0.1:8088 --allow-synthetic-writes
          node "$release_root/scripts/verify-development.mjs" --base-url http://127.0.0.1:8088 --allow-synthetic-writes
          # Recovery must use the recorded release even when no local default image exists.
          backup_output=$(ITSM_API_IMAGE=local/itsm-recovery-unapproved:missing release backup)
          backup_path=${backup_output#Backup verified: }
          [[ "$backup_path" == "$state/backups/"*.dump && -f "$backup_path" ]]
          ITSM_API_IMAGE=local/itsm-recovery-unapproved:missing release restore-check --backup "$backup_path"
      - uses: actions/upload-artifact@v4
        with:
          name: itsm-release-${{ github.sha }}
          path: |
            itsm-release-*.tar.gz
            itsm-release-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
